name: Check links

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # 403/429/999 are publishers, scholar and linkedin blocking bots, not broken links
          args: >-
            --no-progress
            --root-dir "${{ github.workspace }}"
            --timeout 30
            --max-retries 2
            --accept '200..=299,403,429,999'
            --exclude 'lecadb\.co\.uk'
            '*.html' 'alumni/*.html'
          fail: false

      - name: Find open issue
        id: issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "number=$(gh issue list -R ${{ github.repository }} --state open --search 'Broken links in:title' --json number -q '.[0].number')" >> "$GITHUB_OUTPUT"

      - name: Open or update issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links
          content-filepath: ./lychee/out.md
          issue-number: ${{ steps.issue.outputs.number }}
